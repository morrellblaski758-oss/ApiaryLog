workflows:
  compile-check:
    name: Compile Check (no signing)
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Compile
        script: |
          xcodebuild \
            -project "ApiaryLog.xcodeproj" \
            -scheme "ApiaryLog" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/Build/Products/Release-iphoneos/*.app

  ios-build:
    name: Apiary Log iOS Build (App Store)
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      xcode: latest
      # 按名字点名使用 Codemagic 里已上传的证书 + 描述文件，
      # 不走「按类型自动匹配」，避免 No matching profiles。
      # 两个名字必须与 Code signing identities 里的 Reference name 完全一致。
      ios_signing:
        certificates:
          - apiarylog_dist
        provisioning_profiles:
          - apiarylog_profile
    scripts:
      - name: Apply profiles to the project
        script: |
          set -euo pipefail
          # 把已装好的证书/描述文件写进工程设置，同时生成 export_options.plist。
          # 少了这一步，build-ipa 会报 export_options.plist 不存在。
          xcode-project use-profiles
      - name: Show signing files in use
        script: |
          set -euo pipefail
          echo "--- keychain identities ---"
          security find-identity -v -p codesigning || true
          echo "--- provisioning profiles installed ---"
          ls -1 ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null | wc -l
          echo "--- export options ---"
          ls -la /Users/builder/export_options.plist 2>/dev/null || echo "not generated yet"
      - name: Set build number
        script: |
          agvtool new-version -all $BUILD_NUMBER
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "ApiaryLog.xcodeproj" \
            --scheme "ApiaryLog"
    publishing:
      app_store_connect:
        auth: integration
        # 只上传构建，不自动提交「外部测试 Beta 审核」。
        # 外部测试需要先在 ASC 填 TestFlight 测试信息（反馈邮箱、联系人），
        # 那一步失败会连累整个构建；上架本身不需要它。
        submit_to_testflight: false
    artifacts:
      - build/ios/ipa/*.ipa

  ios-build-adhoc:
    name: Apiary Log Ad Hoc (device install)
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      xcode: latest
      # 真机安装用：Ad Hoc 证书 + 包含设备 UDID 的 Ad Hoc 描述文件
      ios_signing:
        certificates:
          - apiarylog_dist
        provisioning_profiles:
          - apiarylog_adhoc
    scripts:
      - name: Apply profiles to the project
        script: |
          set -euo pipefail
          xcode-project use-profiles
      - name: Set build number
        script: |
          agvtool new-version -all $BUILD_NUMBER
      - name: Build Ad Hoc ipa
        script: |
          xcode-project build-ipa \
            --project "ApiaryLog.xcodeproj" \
            --scheme "ApiaryLog"
      - name: Show ipa info
        script: |
          set -euo pipefail
          IPA=$(find build/ios/ipa -maxdepth 1 -name "*.ipa" | head -1)
          echo "ipa: $IPA"
          ls -lh "$IPA"
          unzip -o -q "$IPA" -d /tmp/ipa_check "Payload/*.app/Info.plist" || true
          PLIST=$(find /tmp/ipa_check -name Info.plist | head -1)
          if [ -n "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" 2>/dev/null || true
          fi
    artifacts:
      - build/ios/ipa/*.ipa

  demo-capture:
    name: Demo Screenshots (no signing)
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Build for simulator
        script: |
          xcodebuild \
            -project "ApiaryLog.xcodeproj" \
            -scheme "ApiaryLog" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Capture
        script: |
          set -e
          BUNDLE="com.iskenderergen.apiarylog"
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          mkdir -p capture
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone 17 Pro Max (" | grep -oE "[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          # 先往模拟器沙盒里塞演示数据，截图才不是空列表。
          # 这只影响这台模拟器；打包出去的 .app 里没有任何数据。
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
          python3 tools/seed_demo_data.py "$DATA/Documents/apiarylog.json"
          xcrun simctl launch "$UDID" "$BUNDLE"
          sleep 4
          xcrun simctl io "$UDID" screenshot "capture/01-hives.png"
          sips -g pixelWidth -g pixelHeight capture/01-hives.png || true
          ls -la capture
    artifacts:
      - capture/*.png
