workflows:
  compile-check:
    name: Compile Check (no signing)
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Compile
        script: |
          xcodebuild \
            -project "ApiaryLog.xcodeproj" \
            -scheme "ApiaryLog" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/Build/Products/Release-iphoneos/*.app

  ios-build:
    name: Apiary Log iOS Build (App Store)
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      xcode: latest
    scripts:
      - name: Code signing preflight
        script: |
          echo "--- 凭据检查（只打印有没有，不打印内容）---"
          echo "APP_STORE_CONNECT_ISSUER_ID:      $([ -n "$APP_STORE_CONNECT_ISSUER_ID" ] && echo PRESENT || echo MISSING)"
          echo "APP_STORE_CONNECT_KEY_IDENTIFIER: $([ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] && echo PRESENT || echo MISSING)"
          echo "APP_STORE_CONNECT_PRIVATE_KEY:    $([ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ] && echo PRESENT || echo MISSING)"
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.iskenderergen.apiarylog" \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Verify profiles
        script: |
          echo "--- 钥匙串里的签名身份 ---"
          security find-identity -v -p codesigning || true
          echo "--- 已安装的描述文件数量 ---"
          ls -1 ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null | wc -l
      - name: Set build number
        script: |
          agvtool new-version -all $BUILD_NUMBER
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "ApiaryLog.xcodeproj" \
            --scheme "ApiaryLog"
      - name: Upload to TestFlight
        script: |
          set -e
          IPA=$(find build/ios/ipa -maxdepth 1 -name "*.ipa" | head -1)
          echo "uploading $IPA"
          app-store-connect publish --path "$IPA" --testflight
    artifacts:
      - build/ios/ipa/*.ipa

  demo-capture:
    name: Demo Screenshots (no signing)
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Build for simulator
        script: |
          xcodebuild \
            -project "ApiaryLog.xcodeproj" \
            -scheme "ApiaryLog" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Capture
        script: |
          set -e
          BUNDLE="com.iskenderergen.apiarylog"
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          mkdir -p capture
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone 17 Pro Max (" | grep -oE "[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          # 先往模拟器沙盒里塞演示数据，截图才不是空列表。
          # 这只影响这台模拟器；打包出去的 .app 里没有任何数据。
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
          python3 tools/seed_demo_data.py "$DATA/Documents/apiarylog.json"
          xcrun simctl launch "$UDID" "$BUNDLE"
          sleep 4
          xcrun simctl io "$UDID" screenshot "capture/01-hives.png"
          sips -g pixelWidth -g pixelHeight capture/01-hives.png || true
          ls -la capture
    artifacts:
      - capture/*.png
